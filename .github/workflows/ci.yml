name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
      # Synthetic data only. Live Jev is skipped without a key; financial
      # traces, cookies and profiles are never uploaded as public CI artifacts.
